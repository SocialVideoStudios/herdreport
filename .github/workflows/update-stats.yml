name: Update audience stats

on:
  schedule:
    - cron: "17 10 * * *"   # every day, 10:17 UTC (about 5am Central)
  workflow_dispatch:        # lets you run it any time from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest numbers
        run: node scripts/update-stats.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: Save changes
        run: |
          if git diff --quiet data/stats.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "herd-report-bot"
          git config user.email "herd-report-bot@users.noreply.github.com"
          git add data/stats.json
          git commit -m "Update audience stats"
          git push
