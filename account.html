<style>
.auth{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px;align-items:start}
.auth .card.alt{background:var(--red);color:var(--cream);border-color:var(--red)}
.auth .card.alt input{background:var(--cream);color:#0B0B0D;border-color:var(--cream)}
.auth .card.alt .hint{color:#f1dcdc}
.auth .card.alt .btn{background:var(--cream);color:#85272C;border-color:var(--cream)}
.perks{list-style:none;padding:0;margin:0 0 6px;display:grid;gap:6px}.perks li::before{content:"✓ ";font-weight:700}
.gate{max-width:560px;margin:6vh auto;text-align:center}.gate h1{font-size:clamp(32px,4.6vw,52px);margin-bottom:12px}.gate .btns{margin-top:22px}
.hi{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;margin-bottom:28px}
.hi h1{font-size:clamp(36px,5vw,64px)}.hi p{margin:6px 0 0}
.todo{background:var(--red);color:var(--cream);border-radius:22px;padding:18px 22px;margin-bottom:28px}
.todo h2{font-size:22px;margin-bottom:6px}
.todo .ti{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-top:1px solid rgb(243 239 231/.25);font-weight:600}
.todo .btn{border-color:var(--cream);color:var(--cream);flex:none}.todo .btn:hover{background:var(--cream);color:#85272C}
.blk{margin-bottom:36px}.blk>h2{font-size:clamp(26px,3vw,36px);margin-bottom:14px}
.ord{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px 22px;margin-bottom:14px}
.oh{display:flex;justify-content:space-between;gap:16px;align-items:start}
.oh h3{font-size:22px}.oh p{margin:4px 0 0;font-size:15px}
.pr{font:900 22px Archivo,sans-serif;white-space:nowrap}
.stl{margin:14px 0 0;font-weight:600;font-size:16px;text-decoration:none!important}
.stl.st-pending,.stl.st-refund_requested{color:var(--warn)}.stl.st-approved,.stl.st-paid,.stl.st-live,.stl.st-completed{color:var(--ok)}.stl.st-refunded,.stl.st-declined,.stl.st-cancelled{color:var(--soft)}
.dates{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.dates .dl{font:700 12px Archivo,sans-serif;text-transform:uppercase;color:var(--soft);margin-right:4px}
.dt{border:1.5px solid var(--line);border-radius:999px;padding:4px 11px;font-size:14px;font-weight:600}
.dt.past{opacity:.5;border-style:dashed}.dt.next{background:var(--ink);color:var(--bg)}
.scott{background:var(--bg);border-radius:12px;padding:10px 14px;margin:14px 0 0;font-size:15px}
.oa{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}.oa:empty{display:none}
.lnk{background:none;border:0;padding:0;color:var(--red2);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;min-height:36px}
.panel{border-top:2px solid var(--hair);margin-top:16px;padding-top:16px}
.none{border:2px dashed var(--line);border-radius:20px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.none p{margin:0}
.more{background:var(--card);border:2px solid var(--line);border-radius:20px;margin-bottom:12px}
.more summary{cursor:pointer;padding:18px 22px;font:900 18px Archivo,sans-serif;text-transform:uppercase;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"+";font-size:24px;line-height:1}.more[open] summary::after{content:"–"}
.more summary .soft{font:500 14px 'IBM Plex Sans',sans-serif;text-transform:none;flex:1}
.more>div{padding:0 22px 22px}
.help{color:var(--soft);font-size:15px}
.files{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px}
.file{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:6px 8px 6px 6px;max-width:100%}
.file .th{width:44px;height:44px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;font:900 11px Archivo,sans-serif;color:#85272C}
.file .th img{width:100%;height:100%;object-fit:contain}
.file a{color:inherit;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.file button{border:0;background:none;color:var(--soft);font-size:20px;cursor:pointer;width:32px;height:32px}
.drop{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--line);border-radius:14px;padding:14px;cursor:pointer;font-weight:600;text-align:center;min-height:52px}
.drop.on{background:var(--ink);color:var(--bg)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.brand{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.logo-box{aspect-ratio:1;border:2px solid var(--line);border-radius:18px;background:#fff;display:grid;place-items:center;overflow:hidden;margin-bottom:10px;color:#5a5450;font-size:14px}
.logo-box img{width:100%;height:100%;object-fit:contain}
@media(max-width:700px){.brand{grid-template-columns:minmax(0,1fr)}.brand .logo-box{max-width:160px}.hi .btns{width:100%}.todo .ti{flex-direction:column;align-items:flex-start}.ord{padding:18px}}

body.adm{background:#f5f4f1;font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif}
body.adm #hdr,body.adm #ftr{display:none}body.adm main.band{padding:0}body.adm main.band>.wrap{max-width:none}
.adm h1,.adm h2,.adm h3{font-family:"IBM Plex Sans",system-ui,sans-serif;text-transform:none;letter-spacing:0;font-weight:600;line-height:1.25}
.adm h1{font-size:22px}.adm h2,.adm h3{font-size:16px}
.adm .card{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:16px}
.adm .btn{min-height:32px;padding:0 12px;border-width:1px;border-radius:8px;font:600 13px "IBM Plex Sans",sans-serif;text-transform:none}
.adm .btn.sm{min-height:28px;padding:0 9px;font-size:12.5px}
.adm .btn.solid{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.adm input,.adm textarea{font-size:14px;border-width:1px;border-color:color-mix(in srgb,var(--ink) 25%,transparent);border-radius:8px;padding:7px 10px;min-height:36px;background:var(--card)}
.adm label{font-size:13px}.adm .field{margin-bottom:12px}
.adm .pill{font-size:12px;padding:1px 8px;border-width:1px;white-space:nowrap}
.adm table{font-size:13.5px;width:100%;border-collapse:collapse}.adm th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);font-weight:600;text-align:left;padding:7px 8px;border-bottom:1px solid var(--hair)}
.adm td{padding:8px;border-bottom:1px solid var(--hair);vertical-align:top}.adm tr:last-child td{border-bottom:0}.adm td.acts{white-space:nowrap;text-align:right}.adm td.acts .btn+.btn{margin-left:6px}
.adm .num{text-align:right}
.atop{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--ink);color:var(--bg)}
.atop img{height:26px}.atop b{font-weight:600;font-size:15px;margin-right:auto}
.atop a,.atop button{color:var(--bg);background:none;border:1px solid rgb(243 239 231/.3);border-radius:8px;padding:5px 10px;font:500 13px "IBM Plex Sans",sans-serif;text-decoration:none;cursor:pointer}
.amain{max-width:1240px;margin:0 auto;padding:20px 24px 40px}
.ah{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.ah .soft{display:block}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:10px 12px}
.kpi .v{font-size:22px;font-weight:600;line-height:1.2}.kpi .l{font-size:12px;color:var(--soft)}
.kpi.hot{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}.kpi.hot .v{color:var(--red2)}
.wgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.wd{padding:14px 16px;min-width:0}.wd.wide{grid-column:span 2}
.wd h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}.wd h2 .soft{font-weight:400;font-size:12.5px;text-align:right}
.wr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--hair)}
.wr .w{min-width:0}.wr .w b{font-weight:600}.sub{color:var(--soft);font-size:12.5px}
.wr .r{font-weight:600;white-space:nowrap;display:flex;gap:6px;align-items:center}.wr .a{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.done{color:var(--soft);padding:8px 0;margin:0}
.lg{width:40px;height:40px;border-radius:8px;border:1px solid var(--hair);background:#fff;display:grid;place-items:center;overflow:hidden;font-size:10px;color:#5a5450;flex:none}.lg img{width:100%;height:100%;object-fit:contain}
.help{color:var(--soft);font-size:13px;margin-top:16px}
.adm .modal{position:fixed;inset:0;background:rgb(0 0 0/.5);display:none;place-items:center;z-index:50;padding:16px}.adm .modal.open{display:grid}
.adm .modal .card{width:min(620px,100%);max-height:90vh;overflow:auto}
.adm .brand{grid-template-columns:150px minmax(0,1fr);gap:18px}
@media(max-width:1100px){.wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.wgrid{grid-template-columns:minmax(0,1fr)}.wd.wide{grid-column:auto}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.amain{padding:16px 14px 32px}.atop b{font-size:14px}.hide-m{display:none}.adt thead{display:none}.adt tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--hair)}.adt td{border:0!important;padding:0!important}.adt td:nth-child(2){grid-column:1/-1;grid-row:2;color:var(--soft);font-size:12.5px}.adt td:nth-child(3){grid-column:2;grid-row:1;font-weight:600}.adt td:nth-child(4){grid-column:2;grid-row:2;justify-self:end}.adt td.acts{grid-column:1/-1;text-align:left;margin-top:6px}.adm .brand{grid-template-columns:minmax(0,1fr)}}
</style>

<body data-page="account">
<div id="hdr"></div>
<main class="band"><div class="wrap" id="app"><p class="soft">Loading…</p></div></main>
<div id="ftr"></div>
<script>
{
const {API,LIVE,EDITABLE,esc,money,fmtDate,shortDate,PLACE,STATUS}=HR;
HR.chrome('account');
const app=document.getElementById('app'),$=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
if(qs.has('book')||qs.has('new'))location.replace('advertise.html#shop');
let me=null,pkgs=[],list=[];
const pkgName=id=>(pkgs.find(p=>p.id===id)||{}).name||id;
const title=b=>b.kind==='store'?'Hat order':b.kind==='ad'?(PLACE[b.placement]||'Episode ad')+' ad':pkgName(b.package_id);
const today=new Date().toISOString().slice(0,10);
const isAd=b=>b.kind!=='store';
const live=b=>['approved','paid','live'].includes(b.status);
const needsCreative=b=>isAd(b)&&EDITABLE.includes(b.status)&&(!String(b.notes||'').trim()||!(b.assets||[]).length&&!b.creative_url&&!me.brand?.logo);
const size=n=>n>1e6?(n/1e6).toFixed(1)+' MB':Math.max(1,Math.round(n/1e3))+' KB';
const isImg=f=>/^image\//.test(f.type||'')||/^data:image/.test(f.url||'');

async function start(){pkgs=await API.packages();me=await API.current();
 if(me&&me.role==='admin'){adminGate();return}
 me?home():authView()}

/* ---------- sign in ---------- */
function adminGate(){
 app.innerHTML=`<div class="gate"><p class="kick">My dashboard</p><h1>You're signed in as the admin</h1>
  <p class="soft">This page is for clients. ${LIVE?'Sign out, then sign in with a client account to see it.':'Switch to the sample client to see what clients see.'}</p>
  <div class="btns" style="justify-content:center"><a class="btn solid" href="admin.html">Open admin dashboard</a>${LIVE?'':'<button class="btn" id="asClient">View as sample client</button>'}<button class="btn" id="aOut">Sign out</button></div></div>`;
 $('aOut').onclick=async()=>{await API.signOut();me=null;HR.chrome('account');authView()};
 if($('asClient'))$('asClient').onclick=async()=>{await API.signOut();me=await API.signIn('demo@prairieline.co','sponsor2026');HR.chrome('account');home()};
}
function authView(msg){
 app.innerHTML=`<div class="gate"><p class="kick">My dashboard</p><h1>Sign in to see your orders</h1>
  <p class="soft">Your ads, air dates, hat orders and refunds, all in one place.</p>
  <div class="btns" style="justify-content:center"><button class="btn solid" id="gIn">Sign in</button><button class="btn" id="gNew">Create an account</button></div>
  ${msg?`<p class="err">${esc(msg)}</p>`:''}</div>`;
 $('gIn').onclick=()=>HRPop.login(false);$('gNew').onclick=()=>HRPop.login(true);
 HRPop.login(qs.get('new')==='1');
}
/* ---------- dashboard: simple widgets, admin-style ---------- */
const PST={pending:'Quote requested',approved:'Quote ready',paid:'Paid',live:'Paid · on air',completed:'Paid · done',refund_requested:'Refund requested',refunded:'Refunded',declined:'Declined',cancelled:'Cancelled'};
const HPST={paid:'Paid · preparing to ship',completed:'Paid · shipped'};
const lab=b=>(b.kind==='store'&&HPST[b.status])||PST[b.status]||STATUS[b.status]||b.status;
const PAID=['paid','live','completed'];
const canRefund=b=>['paid','live'].includes(b.status)&&(b.kind==='store'||!(b.episode_dates||[]).length||(b.episode_dates||[]).some(d=>d>=today));
const pill=b=>`<span class="pill st-${esc(b.status)}">${esc(lab(b))}</span>`;
function detail(b){
 if(b.kind==='ad')return (b.episode_dates||[]).map(shortDate).join(', ');
 if(b.kind==='presenting')return 'Pre-roll on 52 episodes';
 if(b.kind==='spotlight')return `Sale ${fmtDate(b.sale_date)}${b.location?' · '+b.location:''}`;
 if(b.kind==='store')return String(b.notes||'').split('\n').filter(l=>!l.startsWith('Ship to')).join(', ');
 return b.sale_date?`Event ${fmtDate(b.sale_date)}`:'Merch partnership';
}
const modal=()=>$('cmodal'),mbody=()=>$('cmbody');
function openModal(html){mbody().innerHTML=html;modal().classList.add('open');mbody().querySelector('input,textarea,button')?.focus()}
function closeModal(){modal().classList.remove('open')}
async function home(){
 list=await API.myBookings();document.body.classList.add('adm');
 const ads=list.filter(b=>isAd(b)&&!['pending','approved'].includes(b.status)),hats=list.filter(b=>b.kind==='store');
 const quotes=list.filter(b=>isAd(b)&&['pending','approved'].includes(b.status));
 const refunds=list.filter(b=>['refund_requested','refunded'].includes(b.status));
 const airs=ads.filter(b=>['paid','live'].includes(b.status)).flatMap(b=>(b.episode_dates||[]).filter(d=>d>=today).map(d=>({d,b}))).sort((x,y)=>x.d.localeCompare(y.d));
 const paid=list.filter(b=>PAID.includes(b.status)).reduce((t,b)=>t+Number(b.amount||0),0);
 const missing=ads.filter(b=>['paid','live'].includes(b.status)&&!String(b.notes||'').trim());
 const W=(t,sub,body,cls='')=>`<section class="card wd ${cls}"><h2><span>${t}</span><span class="soft">${sub}</span></h2>${body}</section>`;
 const row=(l,r,act='')=>`<div class="wr"><div class="w">${l}</div><div class="r">${r}</div>${act?`<div class="a">${act}</div>`:''}</div>`;
 const none=t=>`<p class="done">${t}</p>`,sub=t=>`<div class="sub">${t}</div>`;
 const br=me.brand||{};
 app.innerHTML=`<div class="atop"><img src="mark-light.png" alt=""><b><span class="hide-m">Herd Report · </span>My dashboard</b><a href="index.html">View site</a><button id="out">Sign out</button></div>
 <main class="amain">
  <div class="ah"><div><h1>Hi, ${esc((me.contact_name||'').split(' ')[0]||'there')}</h1><span class="soft">${esc(me.company||'')}</span></div>
   <div class="btns"><a class="btn solid" href="advertise.html#shop">Book ads</a><a class="btn" href="index.html#store">Shop hats</a></div></div>
  <div class="kpis">
   <div class="kpi"><div class="v">${airs.length}</div><div class="l">Upcoming airings</div></div>
   <div class="kpi"><div class="v">${airs[0]?shortDate(airs[0].d):'—'}</div><div class="l">Next air date</div></div>
   <div class="kpi"><div class="v">${money(paid)}</div><div class="l">Paid</div></div>
   <div class="kpi ${missing.length?'hot':''}"><div class="v">${missing.length}</div><div class="l">Ads missing talking points</div></div></div>
  <div class="wgrid">
   ${W('Coming up','Your next airings',airs.length?airs.slice(0,6).map(a=>row(`<b>${fmtDate(a.d)}</b>${sub(esc(PLACE[a.b.placement]||title(a.b)))}`,`<span class="pill st-paid">Paid</span>`)).join(''):none('Nothing scheduled. <a href="advertise.html#shop">Book an ad</a>.'))}
   ${W('My ads',`${ads.length} paid`,ads.length?`<div class="scroll"><table class="adt"><thead><tr><th>Ad</th><th>Air dates</th><th class="num">Paid</th><th>Status</th><th></th></tr></thead><tbody>${ads.map(b=>`<tr>
     <td><b>${esc(title(b))}</b>${!String(b.notes||'').trim()&&EDITABLE.includes(b.status)?sub('<span style="color:var(--warn)">Add talking points</span>'):''}</td><td>${esc(detail(b))}</td><td class="num">${money(b.amount)}</td><td>${pill(b)}</td>
     <td class="acts">${EDITABLE.includes(b.status)?`<button class="btn sm" data-ed="${esc(b.id)}">Ad details</button>`:''}${canRefund(b)?`<button class="btn sm" data-rf="${esc(b.id)}">Refund</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:none('No ads yet.'),'wide')}
   ${W('My merch',`${hats.length} order${hats.length===1?'':'s'}`,hats.length?hats.map(b=>row(`<b>${esc(detail(b))}</b>${sub('Ordered '+shortDate(String(b.created_at).slice(0,10))+' · '+money(b.amount))}`,pill(b),canRefund(b)?`<button class="btn sm" data-rf="${esc(b.id)}">Refund</button>`:'')).join(''):none('No hat orders. <a href="index.html#store">Shop hats</a>.'))}
   ${W('Custom quotes','Sponsorships Scott prices for you',quotes.length?quotes.map(b=>row(`<b>${esc(title(b))}</b>${sub(esc(detail(b)))}${b.admin_note?sub('Scott: '+esc(b.admin_note)):''}`,b.status==='approved'?money(b.amount):pill(b),
     b.status==='approved'?`<button class="btn sm solid" data-pay="${esc(b.id)}">Pay ${money(b.amount)}</button>`:`<button class="btn sm" data-cancel="${esc(b.id)}">Cancel request</button>`)).join(''):none('No quote requests.'))}
   ${W('Refunds',`${money(HR.REFUND_FEE)} fee per refund`,refunds.length?refunds.map(b=>row(`<b>${esc(title(b))}</b>${sub(b.status==='refunded'?'Sent back to your card':'Scott will confirm soon')}`,`${money(b.refund?.amount??Math.max(0,(b.amount||0)-HR.REFUND_FEE))} ${pill(b)}`)).join(''):none('No refunds.'))}
   ${W('My info',esc(me.email),`<div class="wr"><div class="w" style="display:flex;gap:10px;align-items:center"><span class="lg">${br.logo?`<img src="${esc(br.logo.url)}" alt="">`:'Logo'}</span><div><b>Logo and ad info</b>${sub(br.logo?'Logo uploaded':'Add your logo once, Scott uses it for every ad')}</div></div><div class="r"><button class="btn sm" id="eBrand">Edit</button></div></div>
     ${row(`<b>${esc(me.contact_name||'')}</b>${sub(esc([me.company,me.phone].filter(Boolean).join(' · ')))}`,`<button class="btn sm" id="eAcct">Edit</button>`)}`)}
  </div>
  <p class="help">Questions? <a href="contact.html">Contact Scott</a>.</p>
 </main>
 <div class="modal" id="cmodal" role="dialog" aria-modal="true"><div class="card" id="cmbody"></div></div>`;
 $('out').onclick=async()=>{await API.signOut();me=null;document.body.classList.remove('adm');HR.chrome('account');authView()};
 $('cmodal').addEventListener('click',e=>{if(e.target.id==='cmodal')closeModal()});
 $('eBrand').onclick=()=>{openModal('<h3 style="margin-bottom:12px">Logo and ad info</h3><div id="brandPane"></div><div class="btns" style="margin-top:8px"><button class="btn sm" data-x>Close</button></div>');brandView();mbody().querySelector('[data-x]').onclick=()=>{closeModal();home()}};
 $('eAcct').onclick=()=>{openModal('<h3 style="margin-bottom:12px">Contact details and password</h3><div id="acctPane"></div><div class="btns" style="margin-top:8px"><button class="btn sm" data-x>Close</button></div>');accountView();mbody().querySelector('[data-x]').onclick=()=>{closeModal();home()}};
 app.querySelectorAll('[data-ed]').forEach(x=>x.onclick=()=>editAd(list.find(b=>b.id===x.dataset.ed)));
 app.querySelectorAll('[data-rf]').forEach(x=>x.onclick=()=>refund(list.find(b=>b.id===x.dataset.rf)));
 app.querySelectorAll('[data-pay]').forEach(x=>x.onclick=async()=>{x.disabled=true;try{await API.payBooking(x.dataset.pay);home()}catch(e){x.disabled=false;alertMsg(e.message)}});
 app.querySelectorAll('[data-cancel]').forEach(x=>x.onclick=()=>{const b=list.find(y=>y.id===x.dataset.cancel);
  openModal(`<h3>Cancel this quote request?</h3><p class="soft">${esc(title(b))}. Nothing has been charged.</p><div class="btns"><button class="btn sm solid" data-yes>Yes, cancel</button><button class="btn sm" data-x>Keep it</button></div><p class="err"></p>`);
  mbody().querySelector('[data-x]').onclick=closeModal;mbody().querySelector('[data-yes]').onclick=async()=>{try{await API.cancelBooking(b.id);closeModal();home()}catch(e){mbody().querySelector('.err').textContent=e.message}}});
}
function alertMsg(t){openModal(`<p class="err">${esc(t)}</p><button class="btn sm" data-x>Close</button>`);mbody().querySelector('[data-x]').onclick=closeModal}
function refund(b){const back=Math.max(0,Number(b.amount||0)-HR.REFUND_FEE);
 openModal(`<h3 style="margin-bottom:6px">Request a refund</h3><p>${esc(title(b))}: you'll get <b>${money(back)}</b> back (${money(b.amount)} minus the ${money(HR.REFUND_FEE)} fee).${b.kind==='store'?'':' Your spots will be released.'}</p>
  <div class="field"><label for="rr">Reason (optional)</label><textarea id="rr" rows="2"></textarea></div>
  <div class="btns"><button class="btn sm solid" data-yes>Request refund</button><button class="btn sm" data-x>Never mind</button></div><p class="err"></p>`);
 mbody().querySelector('[data-x]').onclick=closeModal;
 mbody().querySelector('[data-yes]').onclick=async e=>{e.target.disabled=true;try{await API.requestRefund(b.id,$('rr').value.trim());closeModal();home()}catch(x){e.target.disabled=false;mbody().querySelector('.err').textContent=x.message}};
}
function editAd(b){
 const draw=()=>{const fs=b.assets||[];
  openModal(`<h3 style="margin-bottom:4px">${esc(title(b))}</h3><p class="soft" style="margin-bottom:12px">${esc(detail(b))}</p>
   <div class="field"><label for="tp">What should Scott say?</label><textarea id="tp" rows="4" placeholder="Products, sale dates, offers, your website or phone number.">${esc(b.notes||'')}</textarea>
   ${me.brand?.points&&!b.notes?`<button type="button" class="lnk" data-fill>Use my saved talking points</button>`:''}</div>
   <p style="font-weight:600;margin:0 0 6px">Files <span class="soft" style="font-weight:400">(optional)</span></p>
   ${fs.length?`<div class="files">${fs.map((f,i)=>fileChip(f,i,'data-rmf')).join('')}</div>`:''}${dropZone('dz','Add a file','image/*,.pdf,.doc,.docx,.txt,.mp3,.wav,.m4a')}
   <div class="btns" style="margin-top:12px"><button class="btn sm solid" data-save>Save</button><button class="btn sm" data-x>Close</button></div><p class="err" data-msg></p>`);
  const msg=mbody().querySelector('[data-msg]'),say=(t,ok)=>{msg.textContent=t;msg.className=ok?'okmsg':'err'};
  const save=async patch=>{try{Object.assign(b,await API.updateMyBooking(b.id,patch));return true}catch(x){say(x.message);return false}};
  mbody().querySelector('[data-fill]')?.addEventListener('click',e=>{$('tp').value=me.brand.points;e.target.remove()});
  mbody().querySelector('[data-x]').onclick=()=>{closeModal();home()};
  mbody().querySelector('[data-save]').onclick=async()=>{if(await save({notes:$('tp').value.trim()})){closeModal();home()}};
  mbody().querySelectorAll('[data-rmf]').forEach(x=>x.onclick=async()=>{const a=[...(b.assets||[])];a.splice(+x.dataset.rmf,1);if(await save({assets:a,notes:$('tp').value.trim()}))draw()});
  wireDrop($('dz'),async files=>{say('Uploading…',true);const a=[...(b.assets||[])];for(const f of files){try{a.push(await API.uploadFile(f))}catch(x){say(x.message);return}}
   if(await save({assets:a,notes:$('tp').value.trim()}))draw()});
 };draw();
}
const fileChip=(f,i,rm)=>`<div class="file"><span class="th">${isImg(f)?`<img src="${esc(f.url)}" alt="">`:esc((f.name.split('.').pop()||'file').slice(0,4).toUpperCase())}</span>
 <span><a href="${esc(f.url)}" target="_blank" rel="noopener" download="${esc(f.name)}">${esc(f.name)}</a><br><span class="soft" style="font-size:12px">${f.size?size(f.size):''}</span></span>${rm?`<button type="button" ${rm}="${i}" aria-label="Remove ${esc(f.name)}">×</button>`:''}</div>`;
function dropZone(id,label,accept){return `<label class="drop" id="${id}"><input type="file" ${accept?`accept="${accept}"`:''} multiple><span>⬆ ${label}</span></label>`}
function wireDrop(el,onFiles){
 const inp=el.querySelector('input');inp.onchange=()=>{onFiles([...inp.files]);inp.value=''};
 ['dragenter','dragover'].forEach(t=>el.addEventListener(t,e=>{e.preventDefault();el.classList.add('on')}));
 ['dragleave','drop'].forEach(t=>el.addEventListener(t,e=>{e.preventDefault();el.classList.remove('on')}));
 el.addEventListener('drop',e=>onFiles([...e.dataTransfer.files]));
}

/* ---------- my info: brand kit ---------- */
function brandView(){
 const br={...(me.brand||{})};
 $('brandPane').innerHTML=`<form id="bf" class="bform" novalidate><div class="brand">
  <div><div class="logo-box">${br.logo?`<img src="${esc(br.logo.url)}" alt="Your logo">`:'No logo yet'}</div>
   ${dropZone('dzl',br.logo?'Replace logo':'Upload logo','image/*,.svg,.pdf')}${br.logo?'<button type="button" class="lnk" id="rml">Remove logo</button>':''}</div>
  <div><div class="field"><label for="bw">Website</label><input id="bw" type="url" placeholder="https://" value="${esc(br.website||'')}"></div>
   <div class="field"><label for="bp">Talking points you use most</label><textarea id="bp" rows="3" placeholder="Who you are, what you sell, where to buy.">${esc(br.points||'')}</textarea></div>
   <div class="field"><label for="bn">How to say your name (optional)</label><input id="bn" value="${esc(br.notes||'')}"></div>
   <button class="btn sm solid" type="submit">Save</button><p class="err" id="bmsg"></p></div></div></form>`;
 const say=(t,ok)=>{$('bmsg').textContent=t;$('bmsg').className=ok?'okmsg':'err'};
 const persist=async()=>{try{me=await API.saveBrand(br);return true}catch(x){say(x.message);return false}};
 const reopen=()=>brandView();
 wireDrop($('dzl'),async files=>{const f=files[0];if(!f)return;say('Uploading…',true);try{br.logo=await API.uploadFile(f)}catch(x){say(x.message);return}if(await persist())reopen()});
 if($('rml'))$('rml').onclick=async()=>{delete br.logo;if(await persist())reopen()};
 $('bf').addEventListener('submit',async e=>{e.preventDefault();Object.assign(br,{website:$('bw').value.trim(),points:$('bp').value.trim(),notes:$('bn').value.trim()});if(await persist())say('Saved.',true)});
}
/* ---------- my info: account ---------- */
function accountView(){
 $('acctPane').innerHTML=`<form id="pf" novalidate><div class="row2"><div class="field"><label for="pc">Ranch or company</label><input id="pc" value="${esc(me.company)}"></div>
  <div class="field"><label for="pn">Your name</label><input id="pn" value="${esc(me.contact_name)}"></div></div>
  <div class="row2"><div class="field"><label for="pe">Email</label><input id="pe" value="${esc(me.email)}" disabled></div>
  <div class="field"><label for="pp">Phone</label><input id="pp" type="tel" value="${esc(me.phone)}"></div></div>
  <button class="btn sm solid" type="submit">Save</button><p class="okmsg" id="pok"></p></form>
  <form id="pw" novalidate style="margin-top:18px;border-top:1px solid var(--hair);padding-top:18px"><div class="field"><label for="np">New password</label><input id="np" type="password" autocomplete="new-password" minlength="8"><div class="hint">At least 8 characters.</div></div>
  <button class="btn sm" type="submit">Change password</button><p class="okmsg" id="wok"></p></form>`;
 $('pf').addEventListener('submit',async e=>{e.preventDefault();try{me=await API.saveProfile({company:$('pc').value.trim(),contact_name:$('pn').value.trim(),phone:$('pp').value.trim()});$('pok').textContent='Saved.'}catch(x){$('pok').textContent=x.message}});
 $('pw').addEventListener('submit',async e=>{e.preventDefault();const v=$('np').value;if(v.length<8){$('wok').textContent='Use at least 8 characters.';return}try{await API.changePassword(v);$('np').value='';$('wok').textContent='Password updated.'}catch(x){$('wok').textContent=x.message}});
}
start().catch(e=>{app.innerHTML=`<p class="err">Something went wrong: ${esc(e.message)}</p>`});
}
</script>
</body>
</html>
