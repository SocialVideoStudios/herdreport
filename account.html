<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client portal | Herd Report</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
.auth{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px;align-items:start}
.auth .card.alt{background:var(--red);color:var(--cream);border-color:var(--red)}
.auth .card.alt input{background:var(--cream);color:#0B0B0D;border-color:var(--cream)}
.auth .card.alt .hint{color:#f1dcdc}
.auth .card.alt .btn{background:var(--cream);color:#85272C;border-color:var(--cream)}
.perks{list-style:none;padding:0;margin:0 0 6px;display:grid;gap:6px}.perks li::before{content:"✓ ";font-weight:700}
.hi{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;margin-bottom:28px}
.hi h1{font-size:clamp(36px,5vw,64px)}.hi p{margin:6px 0 0}
.todo{background:var(--red);color:var(--cream);border-radius:22px;padding:18px 22px;margin-bottom:28px}
.todo h2{font-size:22px;margin-bottom:6px}
.todo .ti{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-top:1px solid rgb(243 239 231/.25);font-weight:600}
.todo .btn{border-color:var(--cream);color:var(--cream);flex:none}.todo .btn:hover{background:var(--cream);color:#85272C}
.blk{margin-bottom:36px}.blk>h2{font-size:clamp(26px,3vw,36px);margin-bottom:14px}
.ord{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px 22px;margin-bottom:14px}
.oh{display:flex;justify-content:space-between;gap:16px;align-items:start}
.oh h3{font-size:22px}.oh p{margin:4px 0 0;font-size:15px}
.pr{font:900 22px Archivo,sans-serif;white-space:nowrap}
.stl{margin:14px 0 0;font-weight:600;font-size:16px;text-decoration:none!important}
.stl.st-pending,.stl.st-refund_requested{color:var(--warn)}.stl.st-approved,.stl.st-paid,.stl.st-live,.stl.st-completed{color:var(--ok)}.stl.st-refunded,.stl.st-declined,.stl.st-cancelled{color:var(--soft)}
.dates{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.dates .dl{font:700 12px Archivo,sans-serif;text-transform:uppercase;color:var(--soft);margin-right:4px}
.dt{border:1.5px solid var(--line);border-radius:999px;padding:4px 11px;font-size:14px;font-weight:600}
.dt.past{opacity:.5;border-style:dashed}.dt.next{background:var(--ink);color:var(--bg)}
.scott{background:var(--bg);border-radius:12px;padding:10px 14px;margin:14px 0 0;font-size:15px}
.oa{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}.oa:empty{display:none}
.lnk{background:none;border:0;padding:0;color:var(--red2);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;min-height:36px}
.panel{border-top:2px solid var(--hair);margin-top:16px;padding-top:16px}
.none{border:2px dashed var(--line);border-radius:20px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.none p{margin:0}
.more{background:var(--card);border:2px solid var(--line);border-radius:20px;margin-bottom:12px}
.more summary{cursor:pointer;padding:18px 22px;font:900 18px Archivo,sans-serif;text-transform:uppercase;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"+";font-size:24px;line-height:1}.more[open] summary::after{content:"–"}
.more summary .soft{font:500 14px 'IBM Plex Sans',sans-serif;text-transform:none;flex:1}
.more>div{padding:0 22px 22px}
.help{color:var(--soft);font-size:15px}
.files{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px}
.file{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:6px 8px 6px 6px;max-width:100%}
.file .th{width:44px;height:44px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;font:900 11px Archivo,sans-serif;color:#85272C}
.file .th img{width:100%;height:100%;object-fit:contain}
.file a{color:inherit;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.file button{border:0;background:none;color:var(--soft);font-size:20px;cursor:pointer;width:32px;height:32px}
.drop{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--line);border-radius:14px;padding:14px;cursor:pointer;font-weight:600;text-align:center;min-height:52px}
.drop.on{background:var(--ink);color:var(--bg)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.brand{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.logo-box{aspect-ratio:1;border:2px solid var(--line);border-radius:18px;background:#fff;display:grid;place-items:center;overflow:hidden;margin-bottom:10px;color:#5a5450;font-size:14px}
.logo-box img{width:100%;height:100%;object-fit:contain}
@media(max-width:700px){.brand{grid-template-columns:minmax(0,1fr)}.brand .logo-box{max-width:160px}.hi .btns{width:100%}.todo .ti{flex-direction:column;align-items:flex-start}.ord{padding:18px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/popups.js"></script>
</head>
<body data-page="account">
<div id="hdr"></div>
<main class="band"><div class="wrap" id="app"><p class="soft">Loading…</p></div></main>
<div id="ftr"></div>
<script>
{
const {API,LIVE,EDITABLE,esc,money,fmtDate,shortDate,PLACE,STATUS}=HR;
HR.chrome('account');
const app=document.getElementById('app'),$=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
if(qs.has('book')||qs.has('new'))location.replace('advertise.html#shop');
let me=null,pkgs=[],list=[];
const pkgName=id=>(pkgs.find(p=>p.id===id)||{}).name||id;
const title=b=>b.kind==='store'?'Hat order':b.kind==='ad'?(PLACE[b.placement]||'Episode ad')+' ad':pkgName(b.package_id);
const today=new Date().toISOString().slice(0,10);
const isAd=b=>b.kind!=='store';
const live=b=>['approved','paid','live'].includes(b.status);
const needsCreative=b=>isAd(b)&&EDITABLE.includes(b.status)&&(!String(b.notes||'').trim()||!(b.assets||[]).length&&!b.creative_url&&!me.brand?.logo);
const size=n=>n>1e6?(n/1e6).toFixed(1)+' MB':Math.max(1,Math.round(n/1e3))+' KB';
const isImg=f=>/^image\//.test(f.type||'')||/^data:image/.test(f.url||'');

async function start(){pkgs=await API.packages();me=await API.current();
 if(me&&me.role==='admin'){location.replace('admin.html');return}
 me?home():authView()}

/* ---------- sign in ---------- */
function authView(msg){
 app.innerHTML=`<div class="sh"><div><p class="kick">Client portal</p><h1>Client login</h1></div>
  <p>Manage your ad spots and merch orders, upload your logo and talking points, and pay invoices. New here? Create an account, or <a href="advertise.html#shop">browse ad spots</a> and create one at checkout.</p></div>
 <div class="auth">
  <form class="card" id="fin" novalidate>
   <h3 style="margin-bottom:18px">Sign in</h3>
   <div class="field"><label for="ie">Email</label><input id="ie" type="email" autocomplete="email" required></div>
   <div class="field"><label for="ip">Password</label><input id="ip" type="password" autocomplete="current-password" required></div>
   <div class="btns"><button class="btn solid" type="submit">Sign in</button>${LIVE?'':'<button class="btn" type="button" id="prev">Preview sign in</button>'}</div>
   <p class="err" id="ierr">${msg?esc(msg):''}</p>
   <p class="soft" style="font-size:14px;margin:14px 0 0">Herd Report team? <a href="admin.html">Admin login</a></p>
  </form>
  <form class="card alt" id="fup" novalidate>
   <h3 style="margin-bottom:12px">Create an account</h3>
   <ul class="perks"><li>See every spot you've booked and when it airs</li><li>Upload your logo and ad files once</li><li>Track hat orders</li></ul>
   <div class="row2" style="margin-top:14px">
    <div class="field"><label for="uc">Ranch or company</label><input id="uc" autocomplete="organization" required></div>
    <div class="field"><label for="un">Your name</label><input id="un" autocomplete="name" required></div></div>
   <div class="row2">
    <div class="field"><label for="ue">Email</label><input id="ue" type="email" autocomplete="email" required></div>
    <div class="field"><label for="uph">Phone</label><input id="uph" type="tel" autocomplete="tel"></div></div>
   <div class="field"><label for="upw">Password</label><input id="upw" type="password" autocomplete="new-password" minlength="8" required><div class="hint">At least 8 characters.</div></div>
   <button class="btn" type="submit">Create account</button>
   <p class="err" id="uerr" style="color:#fff"></p>
  </form></div>`;
 const go=u=>{me=u;if(me.role==='admin'){location.href='admin.html';return}HR.chrome('account');home()};
 $('fin').addEventListener('submit',async e=>{e.preventDefault();$('ierr').textContent='';try{go(await API.signIn($('ie').value,$('ip').value))}catch(x){$('ierr').textContent=x.message}});
 if($('prev'))$('prev').onclick=async()=>{try{go(await API.signIn('demo@prairieline.co','sponsor2026'))}catch(x){$('ierr').textContent=x.message}};
 $('fup').addEventListener('submit',async e=>{e.preventDefault();const er=$('uerr');er.textContent='';
  if(!$('uc').value.trim()||!$('un').value.trim()||!$('ue').value.trim()){er.textContent='Fill in your company, name and email.';return}
  if($('upw').value.length<8){er.textContent='Use a password with at least 8 characters.';return}
  try{const r=await API.signUp({company:$('uc').value.trim(),contact_name:$('un').value.trim(),email:$('ue').value,phone:$('uph').value.trim(),password:$('upw').value});
   if(r.confirm){authView('Check your email to confirm your account, then sign in.');return}go(r.user)}catch(x){er.textContent=x.message}});
}

/* ---------- dashboard (one simple page) ---------- */
const STEP={
 pending:['⏳','Waiting for Scott to approve your order.'],
 approved:['✅','Approved! Pay to lock in your spot.'],
 paid:['✅','Approved and paid. You\'re on the schedule.'],
 live:['🎙','On air now.'],
 completed:['🏁','All done. Thanks for advertising!'],
 refund_requested:['↩','Refund requested.'],
 refunded:['💵','Refunded.'],
 declined:['✕','Scott wasn\'t able to take this one.'],
 cancelled:['✕','Cancelled.']};
const HATSTEP={paid:['📦','Paid. Getting your order ready to ship.'],completed:['🚚','Shipped.']};
const canRefund=b=>['paid','live'].includes(b.status)&&(b.kind==='store'||!(b.episode_dates||[]).length||(b.episode_dates||[]).some(d=>d>=today));
function statusLine(b){const [ic,t]=(b.kind==='store'&&HATSTEP[b.status])||STEP[b.status]||['•',STATUS[b.status]||b.status];let extra='';
 if(b.status==='refund_requested'&&b.refund)extra=` You'll get ${money(b.refund.amount)} back (${money(b.amount)} minus the ${money(HR.REFUND_FEE)} fee). Scott will confirm soon.`;
 if(b.status==='refunded')extra=` ${money(b.refund?.amount??Math.max(0,b.amount-HR.REFUND_FEE))} was sent back to your card.`;
 return `<p class="stl st-${esc(b.status)}"><span aria-hidden="true">${ic}</span> ${esc(t+extra)}</p>`}
function dates(b){const ds=b.episode_dates||[];if(!ds.length)return'';const next=ds.find(d=>d>=today);
 return `<div class="dates"><span class="dl">${b.kind==='presenting'?'Starts':'Airs on'}</span>${ds.map(d=>`<span class="dt ${d<today?'past':d===next?'next':''}">${shortDate(d)}${d<today?' · aired':d===next&&live(b)?' · next':''}</span>`).join('')}</div>`}
function orderCard(b){const hat=b.kind==='store',lines=String(b.notes||'').split('\n');
 return `<article class="ord" data-id="${esc(b.id)}">
  <div class="oh"><div><h3>${esc(title(b))}</h3><p class="soft">${hat?esc(lines.filter(l=>!l.startsWith('Ship to')).join(', ')):esc(b.kind==='ad'?PLACE[b.placement]+' · read by Scott':detail(b))}</p></div><b class="pr">${money(b.amount)}</b></div>
  ${statusLine(b)}${hat?'':dates(b)}
  ${b.admin_note?`<p class="scott"><b>From Scott:</b> ${esc(b.admin_note)}</p>`:''}
  <div class="oa">
   ${b.status==='approved'?`<button class="btn sm solid" data-pay>Pay ${money(b.amount)}</button>`:''}
   ${!hat&&EDITABLE.includes(b.status)?`<button class="btn sm" data-ed aria-expanded="false">${needsCreative(b)?'Add your ad details':'Edit ad details'}</button>`:''}
   ${b.status==='pending'?`<button class="btn sm" data-cancel>Cancel order</button>`:''}
   ${canRefund(b)?`<button class="lnk" data-rf>Request a refund</button>`:''}
  </div>
  <div class="panel" data-panel hidden></div>
 </article>`}
async function home(){
 list=await API.myBookings();
 const ads=list.filter(isAd),hats=list.filter(b=>b.kind==='store');
 const todo=[...ads.filter(b=>b.status==='approved').map(b=>[b,`Pay for your ${title(b)}`,'Pay now','pay']),...ads.filter(needsCreative).map(b=>[b,`Tell Scott what to say in your ${title(b)}`,'Add details','ed'])];
 app.innerHTML=`<div class="hi"><div><p class="kick">My dashboard</p><h1>Hi, ${esc((me.contact_name||'').split(' ')[0]||'there')}</h1><p class="soft">${esc(me.company||'')}</p></div>
  <div class="btns"><a class="btn solid" href="advertise.html#shop">Book ads</a><a class="btn" href="index.html#store">Shop hats</a><button class="btn" id="out">Sign out</button></div></div>
 ${todo.length?`<div class="todo"><h2>To do</h2>${todo.map(([b,t,l,k])=>`<div class="ti"><span>${esc(t)}</span><button class="btn sm" data-jump="${esc(b.id)}" data-k="${k}">${l}</button></div>`).join('')}</div>`:''}
 <section class="blk"><h2>My ads</h2>${ads.length?ads.map(orderCard).join(''):`<div class="none"><p>No ads yet.</p><a class="btn sm solid" href="advertise.html#shop">Book an ad</a></div>`}</section>
 <section class="blk"><h2>My merch</h2>${hats.length?hats.map(orderCard).join(''):`<div class="none"><p>No hat orders yet.</p><a class="btn sm" href="index.html#store">Shop hats</a></div>`}</section>
 <section class="blk"><h2>My info</h2>
  <details class="more" id="dBrand"><summary>Logo and ad info <span class="soft">${me.brand?.logo?'Logo uploaded':'Add your logo once, Scott uses it for every ad'}</span></summary><div id="brandPane"></div></details>
  <details class="more" id="dAcct"><summary>Contact details and password</summary><div id="acctPane"></div></details>
 </section>
 <p class="help">Questions? <a href="contact.html">Contact Scott</a>. Refunds are the order total minus a ${money(HR.REFUND_FEE)} fee.</p>`;
 $('out').onclick=async()=>{await API.signOut();me=null;HR.chrome('account');authView()};
 brandView();accountView();
 app.querySelectorAll('[data-jump]').forEach(x=>x.onclick=()=>{const c=app.querySelector(`.ord[data-id="${x.dataset.jump}"]`);c.scrollIntoView({behavior:'smooth',block:'center'});
  if(x.dataset.k==='ed')openEdit(c);else c.querySelector('[data-pay]')?.focus()});
 app.querySelectorAll('.ord').forEach(wire);
}
function wire(card){
 const b=list.find(x=>x.id===card.dataset.id),panel=card.querySelector('[data-panel]');
 card.querySelector('[data-pay]')?.addEventListener('click',async e=>{e.target.disabled=true;e.target.textContent='Paying…';try{await API.payBooking(b.id);home()}catch(x){e.target.disabled=false;e.target.textContent='Pay '+money(b.amount);panelMsg(card,x.message)}});
 card.querySelector('[data-cancel]')?.addEventListener('click',()=>{panel.hidden=false;panel.innerHTML=`<p><b>Cancel this order?</b> Nothing has been charged yet.</p><div class="btns"><button class="btn sm solid" data-yes>Yes, cancel it</button><button class="btn sm" data-no>Keep it</button></div><p class="err"></p>`;
  panel.querySelector('[data-no]').onclick=()=>{panel.hidden=true};panel.querySelector('[data-yes]').onclick=async()=>{try{await API.cancelBooking(b.id);home()}catch(x){panel.querySelector('.err').textContent=x.message}}});
 card.querySelector('[data-rf]')?.addEventListener('click',()=>{const back=Math.max(0,Number(b.amount||0)-HR.REFUND_FEE);panel.hidden=false;
  panel.innerHTML=`<p><b>Request a refund</b><br>You'll get <b>${money(back)}</b> back (${money(b.amount)} minus the ${money(HR.REFUND_FEE)} fee).${b.kind==='store'?'':' Your spots will be released.'}</p>
   <div class="field"><label for="rr-${esc(b.id)}">Reason (optional)</label><textarea id="rr-${esc(b.id)}" rows="2" placeholder="Let Scott know why"></textarea></div>
   <div class="btns"><button class="btn sm solid" data-yes>Request refund</button><button class="btn sm" data-no>Never mind</button></div><p class="err"></p>`;
  panel.querySelector('[data-no]').onclick=()=>{panel.hidden=true};
  panel.querySelector('[data-yes]').onclick=async e=>{e.target.disabled=true;try{await API.requestRefund(b.id,panel.querySelector('textarea').value.trim());home()}catch(x){e.target.disabled=false;panel.querySelector('.err').textContent=x.message}}});
 card.querySelector('[data-ed]')?.addEventListener('click',()=>openEdit(card));
}
function panelMsg(card,t){const p=card.querySelector('[data-panel]');p.hidden=false;p.innerHTML=`<p class="err">${esc(t)}</p>`}
function openEdit(card){
 const b=list.find(x=>x.id===card.dataset.id),panel=card.querySelector('[data-panel]'),btn=card.querySelector('[data-ed]');
 if(!panel.hidden&&panel.dataset.mode==='ed'){panel.hidden=true;btn.setAttribute('aria-expanded','false');return}
 panel.dataset.mode='ed';panel.hidden=false;btn?.setAttribute('aria-expanded','true');
 const draw=()=>{const fs=b.assets||[];
  panel.innerHTML=`<div class="field"><label for="tp-${esc(b.id)}">What should Scott say?</label><textarea id="tp-${esc(b.id)}" rows="4" placeholder="Products, sale dates, offers, your website or phone number.">${esc(b.notes||'')}</textarea>
   ${me.brand?.points&&!b.notes?`<button type="button" class="lnk" data-fill>Use my saved talking points</button>`:''}</div>
   <p style="font-weight:600;margin:0 0 8px">Files <span class="soft" style="font-weight:400;font-size:14px">(optional: logo, script, images)</span></p>
   ${fs.length?`<div class="files">${fs.map((f,i)=>fileChip(f,i,'data-rmf')).join('')}</div>`:''}
   ${dropZone('dz-'+b.id,'Add a file','image/*,.pdf,.doc,.docx,.txt,.mp3,.wav,.m4a')}
   <div class="btns" style="margin-top:14px"><button class="btn sm solid" data-save>Save</button><button class="btn sm" data-close>Close</button></div><p class="err" data-msg></p>`;
  const msg=panel.querySelector('[data-msg]'),say=(t,ok)=>{msg.textContent=t;msg.className=ok?'okmsg':'err'};
  const save=async patch=>{try{Object.assign(b,await API.updateMyBooking(b.id,patch));return true}catch(x){say(x.message);return false}};
  panel.querySelector('[data-fill]')?.addEventListener('click',e=>{panel.querySelector('textarea').value=me.brand.points;e.target.remove()});
  panel.querySelector('[data-close]').onclick=()=>{panel.hidden=true;btn?.setAttribute('aria-expanded','false')};
  panel.querySelector('[data-save]').onclick=async()=>{if(await save({notes:panel.querySelector('textarea').value.trim()})){say('Saved. Scott can see it now.',true);setTimeout(home,900)}};
  panel.querySelectorAll('[data-rmf]').forEach(x=>x.onclick=async()=>{const a=[...(b.assets||[])];a.splice(+x.dataset.rmf,1);if(await save({assets:a}))draw()});
  wireDrop(panel.querySelector('.drop'),async files=>{say('Uploading…',true);const a=[...(b.assets||[])];
   for(const f of files){try{a.push(await API.uploadFile(f))}catch(x){say(x.message);return}}
   if(await save({assets:a,notes:panel.querySelector('textarea').value.trim()}))draw()});
 };draw();
}
function detail(b){
 if(b.kind==='presenting')return 'Pre-roll on 52 episodes';
 if(b.kind==='spotlight')return `Sale ${fmtDate(b.sale_date)}${b.location?' · '+b.location:''}`;
 return b.sale_date?`Event ${fmtDate(b.sale_date)}`:'Merch partnership';
}
const fileChip=(f,i,rm)=>`<div class="file"><span class="th">${isImg(f)?`<img src="${esc(f.url)}" alt="">`:esc((f.name.split('.').pop()||'file').slice(0,4).toUpperCase())}</span>
 <span><a href="${esc(f.url)}" target="_blank" rel="noopener" download="${esc(f.name)}">${esc(f.name)}</a><br><span class="soft" style="font-size:12px">${f.size?size(f.size):''}</span></span>${rm?`<button type="button" ${rm}="${i}" aria-label="Remove ${esc(f.name)}">×</button>`:''}</div>`;
function dropZone(id,label,accept){return `<label class="drop" id="${id}"><input type="file" ${accept?`accept="${accept}"`:''} multiple><span>⬆ ${label}</span></label>`}
function wireDrop(el,onFiles){
 const inp=el.querySelector('input');inp.onchange=()=>{onFiles([...inp.files]);inp.value=''};
 ['dragenter','dragover'].forEach(t=>el.addEventListener(t,e=>{e.preventDefault();el.classList.add('on')}));
 ['dragleave','drop'].forEach(t=>el.addEventListener(t,e=>{e.preventDefault();el.classList.remove('on')}));
 el.addEventListener('drop',e=>onFiles([...e.dataTransfer.files]));
}

/* ---------- my info: brand kit ---------- */
function brandView(){
 const br={...(me.brand||{})};
 $('brandPane').innerHTML=`<form id="bf" class="bform" novalidate><div class="brand">
  <div><div class="logo-box">${br.logo?`<img src="${esc(br.logo.url)}" alt="Your logo">`:'No logo yet'}</div>
   ${dropZone('dzl',br.logo?'Replace logo':'Upload logo','image/*,.svg,.pdf')}${br.logo?'<button type="button" class="lnk" id="rml">Remove logo</button>':''}</div>
  <div><div class="field"><label for="bw">Website</label><input id="bw" type="url" placeholder="https://" value="${esc(br.website||'')}"></div>
   <div class="field"><label for="bp">Talking points you use most</label><textarea id="bp" rows="3" placeholder="Who you are, what you sell, where to buy.">${esc(br.points||'')}</textarea></div>
   <div class="field"><label for="bn">How to say your name (optional)</label><input id="bn" value="${esc(br.notes||'')}"></div>
   <button class="btn sm solid" type="submit">Save</button><p class="err" id="bmsg"></p></div></div></form>`;
 const say=(t,ok)=>{$('bmsg').textContent=t;$('bmsg').className=ok?'okmsg':'err'};
 const persist=async()=>{try{me=await API.saveBrand(br);return true}catch(x){say(x.message);return false}};
 const reopen=()=>{brandView();$('dBrand').open=true;$('dBrand').querySelector('summary .soft').textContent=me.brand?.logo?'Logo uploaded':'Add your logo once, Scott uses it for every ad'};
 wireDrop($('dzl'),async files=>{const f=files[0];if(!f)return;say('Uploading…',true);try{br.logo=await API.uploadFile(f)}catch(x){say(x.message);return}if(await persist())reopen()});
 if($('rml'))$('rml').onclick=async()=>{delete br.logo;if(await persist())reopen()};
 $('bf').addEventListener('submit',async e=>{e.preventDefault();Object.assign(br,{website:$('bw').value.trim(),points:$('bp').value.trim(),notes:$('bn').value.trim()});if(await persist())say('Saved.',true)});
}
/* ---------- my info: account ---------- */
function accountView(){
 $('acctPane').innerHTML=`<form id="pf" novalidate><div class="row2"><div class="field"><label for="pc">Ranch or company</label><input id="pc" value="${esc(me.company)}"></div>
  <div class="field"><label for="pn">Your name</label><input id="pn" value="${esc(me.contact_name)}"></div></div>
  <div class="row2"><div class="field"><label for="pe">Email</label><input id="pe" value="${esc(me.email)}" disabled></div>
  <div class="field"><label for="pp">Phone</label><input id="pp" type="tel" value="${esc(me.phone)}"></div></div>
  <button class="btn sm solid" type="submit">Save</button><p class="okmsg" id="pok"></p></form>
  <form id="pw" novalidate style="margin-top:18px;border-top:1px solid var(--hair);padding-top:18px"><div class="field"><label for="np">New password</label><input id="np" type="password" autocomplete="new-password" minlength="8"><div class="hint">At least 8 characters.</div></div>
  <button class="btn sm" type="submit">Change password</button><p class="okmsg" id="wok"></p></form>`;
 $('pf').addEventListener('submit',async e=>{e.preventDefault();try{me=await API.saveProfile({company:$('pc').value.trim(),contact_name:$('pn').value.trim(),phone:$('pp').value.trim()});$('pok').textContent='Saved.'}catch(x){$('pok').textContent=x.message}});
 $('pw').addEventListener('submit',async e=>{e.preventDefault();const v=$('np').value;if(v.length<8){$('wok').textContent='Use at least 8 characters.';return}try{await API.changePassword(v);$('np').value='';$('wok').textContent='Password updated.'}catch(x){$('wok').textContent=x.message}});
}
start().catch(e=>{app.innerHTML=`<p class="err">Something went wrong: ${esc(e.message)}</p>`});
}
</script>
</body>
</html>
