<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | Herd Report</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
body.adm{background:light-dark(#f5f4f1,#0f0d0e);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif}
.adm h1,.adm h2,.adm h3,.adm h4{font-family:"IBM Plex Sans",system-ui,sans-serif;text-transform:none;letter-spacing:0;font-weight:600;line-height:1.25}
.adm h2{font-size:16px}.adm h3{font-size:16px}
.adm .card{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:16px}
.adm .btn{min-height:32px;padding:0 12px;border-width:1px;border-radius:8px;font:600 13px "IBM Plex Sans",sans-serif;text-transform:none;gap:6px}
.adm .btn.sm{min-height:28px;padding:0 9px;font-size:12.5px}
.adm .btn.solid{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.adm .btn.go{background:#2f6b3a;border-color:#2f6b3a;color:#fff}
.adm input,.adm select,.adm textarea{font-size:14px;border-width:1px;border-color:color-mix(in srgb,var(--ink) 25%,transparent);border-radius:8px;padding:7px 10px;min-height:36px;background:var(--card)}
.adm textarea{min-height:80px}
.adm label{font-size:13px;margin-bottom:4px}
.adm .field{margin-bottom:12px}
.adm .pill{font-size:12px;padding:1px 8px;border-width:1px}
.adm .kick{font:600 12px "IBM Plex Sans",sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin:0 0 4px}
.adm table{font-size:13.5px}.adm th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--hair)}
.adm td{padding:8px 10px;border-bottom:1px solid var(--hair);vertical-align:top}.adm tr:last-child td{border-bottom:0}
.adm .modal .card{width:min(620px,100%)}
/* frame */
.atop{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--ink);color:var(--bg)}
.atop img{height:26px}.atop b{font-weight:600;font-size:15px;margin-right:auto}
.atop a,.atop button{color:var(--bg);background:none;border:1px solid rgb(243 239 231/.3);border-radius:8px;padding:5px 10px;font:500 13px "IBM Plex Sans",sans-serif;text-decoration:none;cursor:pointer}
.aframe{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 47px)}
.anav{border-right:1px solid var(--hair);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:47px;align-self:start;height:calc(100vh - 47px);overflow:auto}
.anav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;color:inherit;font:500 14px "IBM Plex Sans",sans-serif;padding:8px 10px;border-radius:8px;cursor:pointer}
.anav button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.anav button[aria-current=page]{background:var(--ink);color:var(--bg)}
.anav .c{background:var(--red);color:#fff;border-radius:999px;font-size:11.5px;font-weight:600;min-width:20px;text-align:center;padding:0 6px}
.amain{padding:20px 24px 40px;min-width:0}
.ah{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ah h1{font-size:22px}
/* home */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.kpi:hover{border-color:var(--ink)}
.kpi .v{font-size:22px;font-weight:600;line-height:1.2}.kpi .l{font-size:12px;color:var(--soft)}
.kpi.hot{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.hgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.panel h2{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.panel h2 a,.panel h2 button{font:500 13px "IBM Plex Sans",sans-serif;color:var(--red2);background:none;border:0;cursor:pointer;text-decoration:underline}
.q{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair)}
.q:last-child{border-bottom:0}
.q .t{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;border-radius:6px;padding:3px 6px;text-align:center;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.q .t.order{background:#fff1d6;color:#7a5200}.q .t.refund{background:#fde2e2;color:#8a1c1c}.q .t.ship{background:#e3f0e6;color:#2f6b3a}
.q .t.guest{background:#e5ecf7;color:#2a4a7a}.q .t.msg{background:#efe6f7;color:#5b2a7a}.q .t.review{background:#f7f0dc;color:#6b5513}
.q .w{min-width:0}.q .w b{font-weight:600}.q .w .s{color:var(--soft);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.done{color:var(--soft);padding:14px 0}
.grid5{width:100%;border-collapse:collapse;font-size:12.5px}
.grid5 th{padding:6px;font-size:11px}.grid5 td{padding:5px 6px;border:1px solid var(--hair)}
.grid5 td.o{color:var(--soft)}.grid5 td.b{background:color-mix(in srgb,#2f6b3a 12%,transparent);font-weight:600}.grid5 td.p{background:#fff6e0;font-style:italic;color:#7a5200}
.grid5 td span{display:block;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* widgets */
.wgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.wd{padding:14px 16px;min-width:0}.wd.wide{grid-column:span 2}
.wd h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.wd h2 button{background:none;border:0;padding:0;font:600 15px "IBM Plex Sans",sans-serif;color:inherit;cursor:pointer}
.wd h2 button::after{content:" →";color:var(--soft)}.wd h2 button:hover{text-decoration:underline}
.wd h2 .soft{font-weight:400;font-size:12.5px;text-align:right}
.wss{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;margin-bottom:8px}
.ws{background:color-mix(in srgb,var(--ink) 4%,transparent);border-radius:8px;padding:7px 9px}
.ws b{display:block;font-size:17px;font-weight:600;line-height:1.2}.ws span{font-size:11.5px;color:var(--soft)}
.ws.hot{background:color-mix(in srgb,var(--red) 12%,transparent)}.ws.hot b{color:var(--red2)}
.wr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--hair)}
.wr .w{min-width:0}.wr .w b{font-weight:600}.wr .sub{color:var(--soft);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr .r{font-weight:600;white-space:nowrap}.wr .a{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{border:1px solid var(--hair);background:var(--card);color:inherit;border-radius:999px;padding:5px 12px;font:500 13px "IBM Plex Sans",sans-serif;cursor:pointer}
.chips button span{color:var(--soft);margin-left:4px}.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.chips button[aria-pressed=true] span{color:inherit;opacity:.7}
@media(max-width:1200px){.wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.wgrid{grid-template-columns:minmax(0,1fr)}.wd.wide{grid-column:auto}}
/* lists */
.rev{display:grid;gap:8px}
.rv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:12px 14px}
.rv .meta{color:var(--soft);font-size:13px}
.rv .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cal td{min-width:120px}.cal .open{color:var(--soft)}.cal .slot{display:block;font-weight:600}
.cal .slot.pend{font-weight:400;font-style:italic;color:var(--warn)}.cal .full{background:color-mix(in srgb,#2f6b3a 8%,transparent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters select,.filters input{width:auto;min-width:180px;flex:1 1 180px}
.pk{display:grid;gap:12px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600}.chk input{width:18px;height:18px;min-height:0;accent-color:var(--red)}
.set h3{margin:0 0 12px}.set .card+.card{margin-top:12px}
td .who{font-weight:600}td .sub{color:var(--soft);font-size:12.5px}
.afiles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.afile{display:flex;align-items:center;gap:8px;border:1px solid var(--hair);border-radius:8px;padding:4px 10px 4px 4px;color:inherit;text-decoration:none;font-size:13px;font-weight:600;max-width:100%}
.afile img,.afile span{width:32px;height:32px;object-fit:contain;background:#fff;border-radius:6px;display:grid;place-items:center;font:700 10px "IBM Plex Sans",sans-serif;color:#85272C;flex:none}
.alogin{max-width:400px;margin:10vh auto;padding:0 16px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.hgrid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){.aframe{grid-template-columns:minmax(0,1fr)}.anav{position:sticky;top:47px;z-index:10;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--hair);background:var(--bg);padding:8px}
 .anav button{width:auto;flex:none;gap:6px}.amain{padding:16px 14px 32px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .q{grid-template-columns:minmax(0,1fr)}.q .t{justify-self:start}.q .a{justify-content:flex-start}.atop b{font-size:14px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/popups.js"></script>
</head>
<body class="adm" data-page="admin">
<div id="app"><p class="soft" style="padding:20px">Loading…</p></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="card" id="mbody"></div></div>
<script>
{
const {API,LIVE,esc,money,fmtDate,shortDate,upcoming,SLOTS,PLACE,STATUS,TAKEN}=HR;
const app=document.getElementById('app');
let me=null,pkgs=[],st=null,all=[],guests=[],msgs=[],revs=[],tab=location.hash.slice(1)||'home';
const pkgName=id=>(pkgs.find(p=>p.id===id)||{}).name||id;
const title=b=>b.kind==='store'?'Hat order':b.kind==='ad'?(PLACE[b.placement]||'Episode ad')+' ad':pkgName(b.package_id);
const co=b=>b.client?.company||b.client?.email||'Unknown client';

async function start(){
 me=await API.current();
 if(!me)return login();
 if(me.role!=='admin'){app.innerHTML=`<div class="alogin"><div class="card"><h2 style="margin-bottom:8px">Admins only</h2><p>This dashboard is for the Herd Report team. You're signed in as ${esc(me.email)}.</p><div class="btns"><a class="btn solid" href="account.html">Go to my account</a><button class="btn" id="out">Sign out</button></div></div></div>`;
  document.getElementById('out').onclick=async()=>{await API.signOut();location.reload()};return}
 await load();shell();
}
async function load(){[pkgs,st,all,guests]=await Promise.all([API.packages(),API.settings(),API.allBookings(),API.guests()]);msgs=await API.messages();revs=await API.reviews()}

function login(){
 app.innerHTML=`<div class="alogin" style="text-align:center"><p><img src="logo.png" alt="Herd Report" style="height:64px" class="lt"><img src="logo-light.png" alt="Herd Report" style="height:64px" class="dk"></p>
  <h2 style="margin:12px 0 6px">Herd Report admin</h2><p class="soft">Sign in to manage orders, ads, guests and reviews.</p>
  <div class="btns" style="justify-content:center;margin-top:16px"><button class="btn solid" data-pop="admin">Sign in</button><a class="btn" href="index.html">Back to the site</a></div></div>`;
 HRPop.adminLogin();
}

const TABS=[['home','Home'],['ads','Ad orders'],['merch','Merch orders'],['calendar','Ad calendar'],['guests','Guest applications'],['messages','Messages'],['reviews','Reviews'],['clients','Clients'],['packages','Packages'],['settings','Settings']];
const isHat=b=>b.kind==='store';
function counts(){return{ads:all.filter(b=>!isHat(b)&&['pending','refund_requested'].includes(b.status)).length,merch:all.filter(b=>isHat(b)&&['paid','refund_requested'].includes(b.status)).length,
 guests:guests.filter(g=>g.status==='new').length,messages:msgs.filter(m=>m.status==='new').length,reviews:revs.filter(r=>r.status==='pending').length}}
function shell(){
 const c=counts();
 app.innerHTML=`<div class="atop"><img src="mark-light.png" alt=""><b>Herd Report admin</b><a href="index.html" target="_blank">View site</a><a href="account.html">Client view</a><button id="out">Sign out</button></div>
 <div class="aframe"><nav class="anav" aria-label="Admin">${TABS.map(([k,n])=>`<button data-t="${k}">${n}${c[k]?`<span class="c">${c[k]}</span>`:''}</button>`).join('')}</nav><main class="amain" id="pane"></main></div>`;
 document.getElementById('out').onclick=async()=>{await API.signOut();login()};
 app.querySelector('.anav').addEventListener('click',e=>{const b=e.target.closest('button[data-t]');if(b)go(b.dataset.t)});
 show();
}
function go(t,opts){tab=t;if(opts?.status)fStatus=opts.status;history.replaceState(null,'','#'+t);show();scrollTo(0,0)}
function show(){
 if(!TABS.some(t=>t[0]===tab))tab='home';
 app.querySelectorAll('.anav button').forEach(b=>b.setAttribute('aria-current',b.dataset.t===tab?'page':'false'));
 const titles=Object.fromEntries(TABS);const pane=document.getElementById('pane');
 if(tab!=='home'){pane.innerHTML=`<div class="ah"><h1>${titles[tab]}</h1></div><div id="sub"></div>`}
 ({home,ads:()=>bookings('ads'),merch:()=>bookings('merch'),calendar,guests:guestsView,messages:messagesView,reviews:reviewsView,clients,packages,settings})[tab]();
}
async function refresh(){await load();const y=scrollY;shell();scrollTo(0,y)}
function detail(b){
 if(b.kind==='ad')return `${PLACE[b.placement]||''}: ${b.episode_dates.map(shortDate).join(', ')}`;
 if(b.kind==='presenting')return `Pre-roll × 52, from ${fmtDate(b.episode_dates[0])}`;
 if(b.kind==='spotlight')return `Sale ${fmtDate(b.sale_date)}${b.location?' · '+b.location:''}`;
 if(b.kind==='store')return String(b.notes||'').split('\n').filter(l=>!l.startsWith('Ship to')).join(', ');
 return b.sale_date?`Event ${fmtDate(b.sale_date)}`:'Merch';
}
async function setStatus(id,status){await API.updateBooking(id,{status});await refresh()}

/* ---------- home: a widget for every section ---------- */
function home(){
 const pane=document.getElementById('pane');
 const sumOf=(ss,f=()=>true)=>all.filter(b=>ss.includes(b.status)&&f(b)).reduce((t,b)=>t+(Number(b.amount)||0),0);
 const ads=all.filter(b=>!isHat(b)),hats=all.filter(isHat);
 const weeks=upcoming(5,st.releaseDay??1),next4=weeks.slice(0,4);
 const booked4=ads.filter(b=>TAKEN.includes(b.status)&&b.placement).reduce((t,b)=>t+b.episode_dates.filter(d=>next4.includes(d)).length,0);
 const recent=arr=>[...arr].sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
 const cnt=(arr,k)=>arr.filter(b=>b.status===k).length;
 const shortCo=b=>esc(co(b).split(' ').slice(0,2).join(' '));
 const cell=(d,p)=>{const hit=ads.find(b=>b.placement===p&&b.episode_dates.includes(d)&&TAKEN.includes(b.status)),pen=ads.find(b=>b.placement===p&&b.episode_dates.includes(d)&&b.status==='pending');
  return hit?`<td class="b" title="${esc(co(hit))}"><span>${shortCo(hit)}</span></td>`:pen?`<td class="p" title="Pending: ${esc(co(pen))}"><span>${shortCo(pen)}?</span></td>`:'<td class="o">open</td>'};
 const W=(id,t,sub,body,cls='')=>`<section class="card wd ${cls}"><h2><button data-go="${id}">${t}</button><span class="soft">${sub}</span></h2>${body}</section>`;
 const row=(l,r,act='')=>`<div class="wr"><div class="w">${l}</div><div class="r">${r}</div>${act?`<div class="a">${act}</div>`:''}</div>`;
 const stat=(v,l,hot)=>`<div class="ws ${hot?'hot':''}"><b>${v}</b><span>${l}</span></div>`;
 const none=t=>`<p class="done">${t}</p>`;
 const sub=t=>`<div class="sub">${t}</div>`;

 const adQ=recent(ads.filter(b=>['pending','refund_requested'].includes(b.status)));
 const adW=W('ads','Ad orders',`${ads.length} total`,`<div class="wss">${stat(cnt(ads,'pending'),'New',cnt(ads,'pending'))}${stat(money(sumOf(['approved'],b=>!isHat(b))),'Awaiting payment')}${stat(money(sumOf(['paid','live','completed'],b=>!isHat(b))),'Paid')}${stat(cnt(ads,'refund_requested'),'Refunds asked',cnt(ads,'refund_requested'))}</div>
  ${adQ.length?adQ.slice(0,4).map(b=>row(`<b>${esc(co(b))}</b>${sub(esc(title(b))+' · '+money(b.amount))}`,`<span class="pill st-${esc(b.status)}">${b.status==='pending'?'New':'Refund asked'}</span>`,
   b.status==='pending'?`<button class="btn sm go" data-ap="${esc(b.id)}">Approve</button><button class="btn sm" data-ed="${esc(b.id)}">Open</button>`:`<button class="btn sm go" data-st="${esc(b.id)}" data-v="refunded">Mark refunded</button><button class="btn sm" data-st="${esc(b.id)}" data-v="paid">Deny</button>`)).join(''):none('No new ad orders.')}`);
 const toShip=recent(hats.filter(b=>['paid','refund_requested'].includes(b.status)));
 const hatW=W('merch','Merch orders',`${hats.length} total`,`<div class="wss">${stat(cnt(hats,'paid'),'To ship',cnt(hats,'paid'))}${stat(cnt(hats,'completed'),'Shipped')}${stat(money(sumOf(['paid','completed'],isHat)),'Sales')}</div>
  ${toShip.length?toShip.slice(0,4).map(b=>{const ln=String(b.notes||'').split('\n');return row(`<b>${esc(co(b))}</b>${sub(esc(ln.filter(l=>!l.startsWith('Ship to')).join(', ')))}`,money(b.amount),
   b.status==='paid'?`<button class="btn sm go" data-st="${esc(b.id)}" data-v="completed">Mark shipped</button>`:`<button class="btn sm go" data-st="${esc(b.id)}" data-v="refunded">Mark refunded</button>`)}).join(''):none('Nothing to ship.')}`);
 const calW=W('calendar','Ad calendar',`${booked4}/${next4.length*SLOTS.length} sold, next 4 episodes`,`<div class="scroll"><table class="grid5"><thead><tr><th></th>${SLOTS.map(k=>`<th>${PLACE[k].replace('Mid-roll ','Mid ').replace('-roll','')}</th>`).join('')}</tr></thead>
  <tbody>${weeks.map(d=>`<tr><td><b>${shortDate(d)}</b></td>${SLOTS.map(k=>cell(d,k)).join('')}</tr>`).join('')}</tbody></table></div>`,'wide');
 const gNew=guests.filter(g=>g.status==='new');
 const guestW=W('guests','Guest applications',`${guests.length} total`,`<div class="wss">${stat(gNew.length,'New',gNew.length)}${stat(guests.filter(g=>g.status==='scheduled').length,'Scheduled')}${stat(guests.filter(g=>g.status==='recorded').length,'Recorded')}</div>
  ${gNew.length?gNew.slice(0,3).map(g=>row(`<b>${esc(g.name)}</b>${sub(esc([g.operation,g.location].filter(Boolean).join(' · ')))}`,'',`<button class="btn sm" data-g="${esc(g.id)}">Open</button>`)).join(''):none('No new applications.')}`);
 const mNew=msgs.filter(m=>m.status==='new');
 const msgW=W('messages','Messages',`${msgs.length} total`,`${mNew.length?mNew.slice(0,3).map(m=>row(`<b>${esc(m.name)}</b>${sub(esc((m.topic||'General')+' · '+m.message))}`,'',`<a class="btn sm" href="mailto:${esc(m.email)}?subject=${encodeURIComponent('Re: Herd Report')}">Reply</a><button class="btn sm" data-ms="${esc(m.id)}">Done</button>`)).join(''):none('No new messages.')}`);
 const rNew=revs.filter(r=>r.status==='pending'),rOn=revs.filter(r=>r.status==='approved');
 const revW=W('reviews','Reviews',`${rOn.length} showing on site`,`${rNew.length?rNew.slice(0,3).map(r=>row(`<b><span style="color:var(--red2)">${'★'.repeat(r.rating)}</span> ${esc(r.name)}</b>${sub(esc(r.text))}`,'',`<button class="btn sm go" data-rv="${esc(r.id)}" data-s="approved">Approve</button><button class="btn sm" data-rv="${esc(r.id)}" data-s="hidden">Hide</button>`)).join(''):none('No reviews waiting.')}`);
 const cl={};all.forEach(b=>{const k=b.client_id;cl[k]=cl[k]||{n:co(b),t:0,c:0};cl[k].c++;if(['paid','live','completed'].includes(b.status))cl[k].t+=Number(b.amount)||0});
 const top=Object.values(cl).sort((a,b)=>b.t-a.t).slice(0,4);
 const cliW=W('clients','Clients',`${Object.keys(cl).length} with orders`,top.length?top.map(c=>row(`<b>${esc(c.n)}</b>${sub(c.c+' order'+(c.c>1?'s':''))}`,money(c.t))).join(''):none('No clients yet.'));

function settings(){
 const pane=document.getElementById('sub');const s=st;const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
 pane.innerHTML=`<form class="set" id="sf" novalidate style="max-width:860px">
  <div class="card"><h3>Episode ad prices</h3><div class="row2">
   ${SLOTS.map(k=>`<div class="field"><label for="r-${k}">${PLACE[k]} ($ per episode)</label><input id="r-${k}" type="number" min="0" inputmode="numeric" value="${s.rates[k]}"></div>`).join('')}</div></div>
  <div class="card"><h3>Release schedule</h3>
   <div class="row2"><div class="field"><label for="rd">Episodes release on</label><select id="rd">${days.map((d,i)=>`<option value="${i}" ${i===Number(s.releaseDay)?'selected':''}>${d}</option>`).join('')}</select></div>
   <div class="field"><label for="wa">Weeks open for booking</label><input id="wa" type="number" min="4" max="52" inputmode="numeric" value="${s.weeksAhead}"></div></div></div>
  <div class="card"><h3>Audience numbers on the Advertise page</h3><p class="hint" style="margin:-6px 0 14px">Leave blank to hide a number. Use what Scott's hosting and YouTube dashboards report, like "4,800".</p><div class="row2">
   <div class="field"><label for="sd">Avg downloads per episode</label><input id="sd" value="${esc(s.stats?.downloads||'')}"></div>
   <div class="field"><label for="sv">YouTube views</label><input id="sv" value="${esc(s.stats?.views||'')}"></div>
   <div class="field"><label for="sfw">Social followers</label><input id="sfw" value="${esc(s.stats?.followers||'')}"></div></div></div>
  <div class="btns" style="margin-top:20px;align-items:center"><button class="btn solid" type="submit">Save settings</button><span class="okmsg" id="sok"></span>
</div></form>`;
 const n=id=>Number(document.getElementById(id).value)||0;
 document.getElementById('sf').addEventListener('submit',async e=>{e.preventDefault();
  const ns={...s,rates:Object.fromEntries(SLOTS.map(k=>[k,n('r-'+k)])),releaseDay:n('rd'),weeksAhead:Math.min(52,Math.max(4,n('wa'))),
   stats:{downloads:document.getElementById('sd').value.trim(),views:document.getElementById('sv').value.trim(),followers:document.getElementById('sfw').value.trim()}};
  try{st=await API.saveSettings(ns);document.getElementById('sok').textContent='Saved.'}catch(x){document.getElementById('sok').textContent=x.message}});
 const r=document.getElementById('reset');if(r)r.onclick=()=>{API.reset();location.reload()};
}

start().catch(e=>{app.innerHTML=`<p class="err">Something went wrong: ${esc(e.message)}</p>`});
}
</script>
</body>
</html>
