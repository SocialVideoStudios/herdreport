<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog | Herd Report</title>
<meta name="description" content="Stories, breeding insight and ranch visits from Herd Report with Scott Beck.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
.bhead{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(24px,4vw,44px)}
.bhead .lede{max-width:520px;font-size:18px;margin:14px 0 0}
.filter{display:flex;gap:8px;flex-wrap:wrap}
.filter button{min-height:40px;border:2px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:0 14px;font:700 13px Archivo,sans-serif;text-transform:uppercase;cursor:pointer}
.filter button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.feed{max-width:820px;margin:0 auto;display:grid;gap:18px}
.post{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:clamp(20px,3vw,36px);scroll-margin-top:96px}
.post.lead{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.post.lead .meta{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.post.lead .read{border-color:var(--bg);color:var(--bg)}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:700 13px Archivo,sans-serif;text-transform:uppercase;color:var(--soft);margin-bottom:12px}
.meta .tag{background:var(--red);color:var(--cream);border-radius:999px;padding:4px 10px}
.post h2{font-size:clamp(26px,3.4vw,40px);margin-bottom:14px}
.post.lead h2{font-size:clamp(30px,4.6vw,54px)}
.post h2 a{color:inherit;text-decoration:none}
.post h2 a:hover{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.ex{font-size:17px;margin:0 0 18px;color:inherit;opacity:.86}
.read{display:inline-flex;align-items:center;gap:8px;min-height:44px;border:2px solid var(--line);border-radius:999px;padding:0 18px;background:transparent;color:inherit;font:700 14px Archivo,sans-serif;text-transform:uppercase;cursor:pointer}
.body{display:none;font-size:18px;line-height:1.7;border-top:2px solid var(--hair);margin-top:22px;padding-top:22px}
.post.open .body{display:block}.post.open .ex{display:none}
.post.lead .body{border-color:color-mix(in srgb,var(--bg) 22%,transparent)}
.body p{margin:0 0 1.1em}.body h2,.body h3,.body h4{font-size:22px;margin:1.6em 0 .6em}
.body a{color:var(--red2)}.post.lead .body a{color:#e9a9ad}
.body blockquote{margin:1.2em 0;padding-left:18px;border-left:4px solid var(--red);font-weight:500}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.share{background:none;border:0;color:inherit;font:700 13px Archivo,sans-serif;text-transform:uppercase;cursor:pointer;opacity:.75;min-height:44px}
.more{display:flex;justify-content:center;padding:18px 0 0}
.empty{text-align:center;padding:40px 0}
.listen{max-width:820px;margin:28px auto 0;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-top:2px solid var(--hair);padding-top:24px}
.listen h3{font-size:22px}
@media(max-width:600px){.post{border-radius:18px}.body{font-size:17px}.filter{display:none}}
</style>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/popups.js"></script>
</head>
<body>
<div id="hdr"></div>
<main class="band">
 <div class="wrap">
  <div class="bhead">
   <div><p class="kick">From the barn</p><h1>The Herd Report blog</h1>
   <p class="lede">Breeding insight, sire stories and ranch visits from the conversations on the show.</p></div>
   <div class="filter" id="filter" role="group" aria-label="Filter posts"></div>
  </div>
  <div class="feed" id="feed" aria-live="polite"><p class="empty">Loading posts…</p></div>
  <div class="more"><span id="sentinel"></span></div>
  <div class="listen"><h3>Hear the full conversations</h3><div class="btns"><a class="btn solid" href="index.html#episodes">Watch episodes</a><a class="btn" href="guests.html">Past guests</a></div></div>
 </div>
</main>
<div id="ftr"></div>
<script>
{
const {esc}=HR;HR.chrome('blog');
const feed=document.getElementById('feed'),filt=document.getElementById('filter');
const TAGS=[['all','All'],['angus','Angus'],['hereford','Hereford'],['sire','Sire stories'],['ranch','Ranch visits']];
const tagOf=p=>{const t=(p.title+' '+p.excerpt).toLowerCase();
 if(/hereford|baldy/.test(t))return['hereford','Hereford'];
 if(/capitalist|j signature|courage|beneficial|\bbull\b/.test(t))return['sire','Sire story'];
 if(/tour|ranch|journey|behind the scenes/.test(t))return['ranch','Ranch visit'];return['angus','Angus']};
const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
let posts=[],shown=[],n=0,cur='all';const STEP=4;
function card(p,i){const [k,l]=tagOf(p);return `<article class="post ${i===0&&cur==='all'?'lead':''}" id="${esc(p.slug)}">
 <div class="meta"><span class="tag">${esc(l)}</span><span>${fmt(p.date)}</span><span>· ${p.minutes} min read</span></div>
 <h2><a href="#${esc(p.slug)}" data-open>${esc(p.title)}</a></h2>
 <p class="ex">${esc(p.excerpt)}</p>
 <div class="body">${p.html}</div>
 <div class="actions"><button class="read" data-open aria-expanded="false">Read the post</button><button class="share" data-share>Copy link</button></div></article>`}
function more(){const next=shown.slice(n,n+STEP);if(!next.length)return;feed.insertAdjacentHTML('beforeend',next.map((p,j)=>card(p,n+j)).join(''));n+=next.length}
function render(){feed.innerHTML='';n=0;shown=cur==='all'?posts:posts.filter(p=>tagOf(p)[0]===cur);
 if(!shown.length){feed.innerHTML='<p class="empty">No posts here yet.</p>';return}more();
 filt.innerHTML=TAGS.filter(([k])=>k==='all'||posts.some(p=>tagOf(p)[0]===k)).map(([k,l])=>`<button data-k="${k}" aria-pressed="${k===cur}">${l}</button>`).join('')}
function toggle(a,force){const open=force??!a.classList.contains('open');a.classList.toggle('open',open);
 const b=a.querySelector('.read');b.textContent=open?'Close':'Read the post';b.setAttribute('aria-expanded',open);
 if(!open)a.scrollIntoView({block:'start',behavior:'smooth'})}
feed.addEventListener('click',e=>{const a=e.target.closest('.post');if(!a)return;
 if(e.target.closest('[data-open]')){e.preventDefault();toggle(a);if(a.classList.contains('open'))history.replaceState(null,'','#'+a.id)}
 if(e.target.closest('[data-share]')){const b=e.target.closest('[data-share]');navigator.clipboard?.writeText(location.href.split('#')[0]+'#'+a.id).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy link',1500)})}});
filt.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cur=b.dataset.k;render()});
new IntersectionObserver(es=>{if(es[0].isIntersecting)more()},{rootMargin:'600px'}).observe(document.getElementById('sentinel'));
fetch('data/blog.json').then(r=>r.json()).then(d=>{posts=d;render();
 const h=decodeURIComponent(location.hash.slice(1));if(h){const i=shown.findIndex(p=>p.slug===h);if(i>=0){while(n<=i)more();const a=document.getElementById(h);toggle(a,true);setTimeout(()=>a.scrollIntoView({block:'start'}),50)}}})
 .catch(()=>{feed.innerHTML='<p class="empty">Posts are loading slowly. Refresh in a moment.</p>'});
}
</script>
</body>
</html>
